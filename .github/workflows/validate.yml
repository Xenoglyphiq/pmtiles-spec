name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Validate spec and fixtures
        run: uv run .kit/validate.py .

      - name: Fixtures are reproducible
        run: |
          uv run conformance/generate/generate.py
          git diff --exit-code conformance/

      - name: Benchmark input is reproducible
        run: |
          uv run bench/generate.py
          git diff --exit-code bench/

      - name: Reference benchmark builds and matches the checksum
        run: cargo run --release --manifest-path bench/rust/Cargo.toml
